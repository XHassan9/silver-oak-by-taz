<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silver Oak Financial: Getting to know you</title>
<style>
:root{--oak:#5c3d1e;--oak-d:#3b2412;--gold:#c9a24a;--cream:#faf6ee;--line:#e8ddcf;--muted:#7a6a58;--ok:#2f7d4f}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#2b2118;font:16px/1.5 Lato,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(180deg,var(--oak-d),var(--oak));color:#f6efe4;padding:18px 20px}
header b{font:700 20px Georgia,serif;display:block}header small{opacity:.8}
.demo{background:#fff5d6;border-bottom:1px solid #ecd9a0;color:#6b5412;font-size:13.5px;padding:8px 20px;text-align:center}
main{max-width:680px;margin:0 auto;padding:20px 16px 90px}
.bar{height:8px;background:#eadfce;border-radius:99px;overflow:hidden;margin:6px 0 4px}.bar div{height:100%;background:var(--gold);width:0;transition:width .25s}
.step{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px;box-shadow:0 2px 10px rgba(60,36,14,.06)}
h2{font:700 22px Georgia,serif;margin:0 0 4px;color:var(--oak-d)}p.lead{margin:0 0 14px;color:var(--muted);font-size:14.5px}
label{display:block;font-weight:700;margin:14px 0 4px;font-size:14.5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #d8cbb7;border-radius:10px;padding:11px 12px;font:inherit;background:#fff}
textarea{min-height:92px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opts label{display:inline-flex;align-items:center;gap:7px;margin:0;font-weight:600;border:1.5px solid #d8cbb7;border-radius:99px;padding:8px 13px;cursor:pointer;font-size:14px;background:#fff}
.opts input{margin:0;accent-color:var(--oak)}.opts label:has(input:checked){background:var(--oak);color:#fff;border-color:var(--oak)}
.col label{display:flex;border-radius:10px;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav div{max-width:680px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:800;border-radius:12px;padding:13px 18px;border:1.5px solid var(--oak);cursor:pointer}
.back{background:#fff;color:var(--oak)}.next{background:var(--oak);color:#fff;flex:1}
.safe{font-size:13px;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:flex-start}
.rv dt{font-weight:700;color:var(--oak-d);margin-top:12px;font-size:14px}.rv dd{margin:2px 0 0;white-space:pre-wrap}
.done{text-align:center;padding:30px 10px}.done .ck{width:60px;height:60px;border-radius:50%;background:#e4f3ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:30px}
a.btn{display:inline-block;margin-top:14px;background:var(--oak);color:#fff;text-decoration:none;border-radius:12px;padding:12px 18px;font-weight:800}
.range{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--oak)}
</style></head><body>
<header><b>Silver Oak Financial</b><small>Getting to know you</small></header>
<div class="demo">Demo form. Please use made-up details. Nothing you enter leaves your browser.</div>
<main id="m"></main>
<div class="nav" id="nv"><div><button class="back" id="bk">Back</button><button class="next" id="nx">Continue</button></div></div>
<script>
(function(){
var HH=(location.search.match(/[?&]hh=([^&]+)/)||[])[1]||'';
var KEY='taz_ff_draft', SUB='taz_ff_submissions';
var A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
var STEPS=['About you','Work and income','Savings and debts','Your goals','Comfort with ups and downs','Questions and documents','Review'];
var i=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inp(id,l,ph,type){return '<label for="'+id+'">'+l+'</label><input type="'+(type||'text')+'" id="'+id+'" data-k="'+id+'" placeholder="'+(ph||'')+'" value="'+esc(A[id]||'')+'">'}
function sel(id,l,opts){return '<label for="'+id+'">'+l+'</label><select id="'+id+'" data-k="'+id+'"><option value="">Choose one</option>'+opts.map(function(o){return '<option'+(A[id]===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}
function chk(id,l,opts){var v=A[id]||[];return '<label>'+l+'</label><div class="opts">'+opts.map(function(o){return '<label><input type="checkbox" data-m="'+id+'" value="'+esc(o)+'"'+(v.indexOf(o)>-1?' checked':'')+'>'+o+'</label>'}).join('')+'</div>'}
function txt(id,l,ph){return '<label for="'+id+'">'+l+'</label><textarea id="'+id+'" data-k="'+id+'" placeholder="'+(ph||'')+'">'+esc(A[id]||'')+'</textarea>'}
var SAFE='<div class="safe">&#128274; We never ask for Social Security numbers or account numbers. Ranges and your own words are enough.</div>';
var VIEWS=[
function(){return '<h2>About you</h2><p class="lead">A few basics so we can talk about the right things.</p>'+inp('names','Your name, and your partner\'s if you have one','e.g. Sam and Alex')+sel('age','Your age',['Under 35','35 to 44','45 to 54','55 to 59','60 to 64','65 to 74','75 or older'])+inp('town','Town or city','')+chk('fam','Who relies on you?',['Partner','Children','Grandchildren','Parents','Business partners','Just me'])+SAFE},
function(){return '<h2>Work and income</h2><p class="lead">This helps us see how much room you have to plan.</p>'+sel('work','What best describes your work?',['Employed','Self-employed or business owner','Both','Retired','Between jobs'])+sel('retage','When would you like to stop working full time?',['Already retired','Within 2 years','3 to 5 years','6 to 10 years','More than 10 years','Not sure yet'])+sel('inc','Household income each year, roughly',['Under $100k','$100k to $200k','$200k to $350k','$350k to $500k','Over $500k'])+SAFE},
function(){return '<h2>Savings and debts</h2><p class="lead">Tick what you have. Ranges are fine.</p>'+chk('acc','Where do you keep your savings?',['401(k) or 403(b)','IRA','Roth IRA','Taxable brokerage','Cash and savings','Pension','HSA','Rental property','Business ownership'])+sel('invest','All savings and investments together, roughly',['Under $250k','$250k to $500k','$500k to $1M','$1M to $2M','Over $2M'])+chk('debt','Any debts?',['Mortgage','Student loans','Car loans','Credit cards','Business loan','None'])+sel('debtamt','All debts together, roughly',['None','Under $100k','$100k to $300k','$300k to $600k','Over $600k'])+SAFE},
function(){return '<h2>Your goals</h2><p class="lead">In your own words. There are no wrong answers.</p>'+chk('prio','What matters most? Pick up to three.',['Retire comfortably','Pay for college','Healthcare costs','Leave something behind','Sell or hand off a business','Lower taxes','Protect my family','Travel'])+txt('goals','What would a great retirement or next chapter look like?','e.g. Stop working at 62, travel in the spring, help with the grandkids')+sel('time','When do these goals start to matter?',['Right now','1 to 3 years','4 to 10 years','More than 10 years'])},
function(){var v=A.comfortN||3;var lbl=['','Very cautious','Cautious','Balanced','Comfortable with swings','Very comfortable'];return '<h2>Comfort with ups and downs</h2><p class="lead">Markets move. This tells us how much movement feels okay to you.</p><label>How comfortable are you with your accounts going up and down?</label><input type="range" id="cn" min="1" max="5" value="'+v+'"><div class="range"><span>Cautious</span><span id="cl" style="font-weight:700;color:var(--oak)">'+lbl[v]+'</span><span>Comfortable</span></div>'+sel('drop','If your accounts fell 20% in one year, you would probably',['Sell some to feel safe','Wait and do nothing','Talk to an advisor first','See it as a chance to invest more'])},
function(){return '<h2>Questions and documents</h2><p class="lead">Last step before you review.</p>'+txt('qs','What questions do you want us to answer?','e.g. When should we claim Social Security?')+chk('docs','Documents you can share later, if you like',['Recent account statements','Last two tax returns','Estate documents','Insurance policies','Pension or benefits summary'])+SAFE}
];
function lab(k){return A[k]||'Not answered'}
function arr(k){return (A[k]&&A[k].length)?A[k].join(', '):'Not answered'}
function payload(){return {
 about:[lab('names'),A.age?'Age: '+A.age:'',A.town?'Lives in '+A.town:'',A.fam&&A.fam.length?'Relies on them: '+A.fam.join(', '):''].filter(function(x){return x&&x!=='Not answered'}).join('. '),
 income:[A.work?'Work: '+A.work:'',A.retage?'Retire: '+A.retage:'',A.inc?'Household income: '+A.inc:''].filter(Boolean).join('. '),
 assets:[A.acc&&A.acc.length?'Accounts: '+A.acc.join(', '):'',A.invest?'Savings and investments: '+A.invest:'',A.debt&&A.debt.length?'Debts: '+A.debt.join(', '):'',A.debtamt?'Total debts: '+A.debtamt:''].filter(Boolean).join('. '),
 goals:[A.prio&&A.prio.length?'Priorities: '+A.prio.join(', '):'',A.goals||'',A.time?'Timing: '+A.time:''].filter(Boolean).join('. '),
 comfort:[['','Very cautious','Cautious','Balanced','Comfortable with swings','Very comfortable'][A.comfortN||3],A.drop?'If accounts fell 20%: '+A.drop:''].filter(Boolean).join('. '),
 questions:A.qs||'',
 docs:A.docs&&A.docs.length?A.docs.join(', '):''}}
function review(){var p=payload();var L={about:'About you',income:'Work and income',assets:'Savings and debts',goals:'Your goals',comfort:'Comfort with ups and downs',questions:'Your questions',docs:'Documents you can share'};
 return '<h2>Review</h2><p class="lead">Look this over. You can go back and change anything.</p><dl class="rv">'+Object.keys(L).map(function(k){return '<dt>'+L[k]+'</dt><dd>'+esc(p[k]||'Not answered')+'</dd>'}).join('')+'</dl>'}
function draw(){
 var m=document.getElementById('m');
 var pct=Math.round(100*(i+1)/STEPS.length);
 var body=i<STEPS.length-1?VIEWS[i]():review();
 m.innerHTML='<div class="step"><span>Step '+(i+1)+' of '+STEPS.length+'</span><span>'+STEPS[i]+'</span></div><div class="bar"><div style="width:'+pct+'%"></div></div><div class="card">'+body+'</div>';
 document.getElementById('bk').style.visibility=i?'visible':'hidden';
 document.getElementById('nx').textContent=i===STEPS.length-1?'Submit':'Continue';
 window.scrollTo(0,0);
 var cn=document.getElementById('cn');if(cn)cn.oninput=function(){A.comfortN=+cn.value;document.getElementById('cl').textContent=['','Very cautious','Cautious','Balanced','Comfortable with swings','Very comfortable'][cn.value];save()};
}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.k){A[t.dataset.k]=t.value;save()}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.k){A[t.dataset.k]=t.value;save()}
 if(t.dataset&&t.dataset.m){var k=t.dataset.m;var cur=A[k]||[];if(t.checked){if(cur.indexOf(t.value)<0)cur.push(t.value)}else cur=cur.filter(function(x){return x!==t.value});
  if(k==='prio'&&cur.length>3){cur=cur.slice(-3);A[k]=cur;save();draw();return}
  A[k]=cur;save()}});
document.getElementById('bk').onclick=function(){if(i>0){i--;draw()}};
document.getElementById('nx').onclick=function(){
 if(i<STEPS.length-1){i++;draw();return}
 var subs=[];try{subs=JSON.parse(localStorage.getItem(SUB)||'[]')}catch(e){}
 subs.push({hh:HH,at:Date.now(),a:payload()});try{localStorage.setItem(SUB,JSON.stringify(subs));localStorage.removeItem(KEY)}catch(e){}
 document.getElementById('nv').style.display='none';
 document.getElementById('m').innerHTML='<div class="card done"><div class="ck">&#10003;</div><h2>Thank you</h2><p class="lead">Your answers are with your advisor. They will use them to make the first meeting about you, not about paperwork.</p><p class="lead">(Demo: this stayed in your browser. In the live version it goes straight into your household record.)</p><a class="btn" href="portal.html">Back to the advisor portal</a></div>';
};
draw();
})();
</script></body></html>
