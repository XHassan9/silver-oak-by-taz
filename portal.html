<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Oak Financial by TAZ</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f0;--panel:#fff;--panel2:#f4ede4;--line:#e8ddcf;--text:#2b2118;--muted:#7a6a5a;--oak:#5c3d1e;--oak2:#7a5530;--soft:#efe4d6;--gold:#8a6914;--ok:#14996a;--oks:#e1f5ec;--warn:#c97f0c;--warns:#fdf1dc;--bad:#d24343;--bads:#fbe6e6;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Lato,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 10px 16px}
.brand img{width:100%;max-width:190px;height:auto}
.brand .nm{font:700 17px "Playfair Display",Georgia,serif}
.by{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.by b{color:var(--gold)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;width:100%;font-weight:700}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--soft);color:var(--oak)}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{padding:22px 28px 110px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font:700 26px "Playfair Display",Georgia,serif;letter-spacing:-.01em}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--oak);border-color:var(--oak);color:#fff}
.btn.pri:hover{background:var(--oak2)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;color:var(--text)}
a.btn.pri{color:#fff}
.banner{background:var(--warns);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:4px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.meter{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px}
.meter div{height:100%;background:var(--oak)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
.grid2>*,.kpis>*{min-width:0}
.card h3{font-size:14px;font-weight:900;margin-bottom:12px}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.track{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--oak);border-radius:6px}
.fill.g{background:var(--gold)}
.n{text-align:right;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}
.pill.bad{background:var(--bads);color:var(--bad)}
.pill.warn{background:var(--warns);color:var(--warn)}
.pill.acc{background:var(--soft);color:var(--oak)}
.link{color:var(--oak);cursor:pointer;background:none;border:0;padding:0;font-weight:700;text-align:left}
.link:hover{text-decoration:underline}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.colm{flex:0 0 250px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.colm.drop{outline:2px dashed var(--oak);outline-offset:-3px}
.colh{padding:12px 12px 8px;display:flex;align-items:baseline;gap:8px}
.colh b{font-size:13.5px}
.cards{padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer}
.deal:hover{border-color:var(--oak)}
.deal.dragging{opacity:.45}
.deal .tt{font-weight:900;margin-bottom:2px}
.deal .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.chip.on{background:var(--oak);border-color:var(--oak);color:#fff}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:900;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--oak);display:inline-grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
.namecell{display:flex;align-items:center;gap:10px}
.task{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cbx svg{width:14px;height:14px}
.grp{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:40;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:45;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font:700 20px "Playfair Display",Georgia,serif}
.db{padding:16px 20px 40px;overflow-y:auto;flex:1}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel2)}
.facts{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:4px 0 16px}
.facts .k{color:var(--muted);font-size:13px}
.sec{margin-top:20px}
.sec h4{margin:0 0 8px;font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec h4 .btn{margin-left:auto}
.notes{white-space:pre-wrap;background:var(--panel2);border-radius:9px;padding:10px 12px;font-size:13.5px}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,22,.42)}
.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);width:min(500px,100%);max-height:92vh;display:flex;flex-direction:column}
.mbox h2{font:700 19px "Playfair Display",Georgia,serif;padding:18px 20px 6px}
.mform{padding:10px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);font-weight:700}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
.inp:focus{outline:2px solid var(--soft);border-color:var(--oak)}
textarea.inp{min-height:84px;resize:vertical}
.mfoot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.ribbon{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--oak);color:#f6efe4;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 16px;font-size:13px}
.ribbon b{color:#d9b45a;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.check{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.check.ok{border-color:var(--ok);background:var(--oks)}
.check.bad{border-color:var(--bad);background:var(--bads)}
.mobnav{display:none}
.taz-foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.taz-foot b{color:var(--gold)}
.callgrid{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}
.callgrid>*{min-width:0}
.qlist{max-height:calc(100vh - 330px);min-height:200px;overflow:auto}
.qi{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:9px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-top:1px solid var(--line)}
.qi:hover{background:var(--panel2)}.qi.on{background:var(--soft)}
.q{border:1.5px solid var(--line);border-left:4px solid var(--oak);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;font-size:15.5px;line-height:1.55;background:var(--panel)}
.q:hover{border-color:var(--oak2)}.q.done{opacity:.5;background:var(--panel2);border-left-color:var(--ok)}
.adlib{background:var(--warns);color:var(--warn);border-radius:4px;padding:0 4px;font-weight:700}
.stg{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13.5px}
.stg-g{margin-bottom:4px}
.obj{margin-top:8px;padding-left:10px;border-left:3px solid var(--line);font-size:14.5px}

/* ===== brand enhancement: Silver Oak oak + gold ===== */
:root{--oak-d:#3b2412;--oak-m:#4a2f17;--gold2:#c9a24a;--gold3:#e7d3a0;--cream:#f6efe4;--sand:#dad0c3;--sh:0 1px 2px rgba(60,36,14,.06),0 10px 28px rgba(60,36,14,.08)}
html,body{background:radial-gradient(1200px 500px at 85% -10%,rgba(201,162,74,.14),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(92,61,30,.08),transparent 60%),var(--bg);background-attachment:fixed}
.side{background:linear-gradient(180deg,var(--oak-d) 0%,var(--oak) 100%);border-right:0;box-shadow:4px 0 24px rgba(40,24,8,.18);color:var(--cream);position:sticky;overflow:hidden}
.side::after{content:"";position:absolute;left:-40px;bottom:-30px;width:260px;height:260px;opacity:.09;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23e7d3a0'><path d='M50 6c10 8 18 20 18 34 0 8-3 14-8 19 6-1 12-5 16-11 3 12-3 25-14 31v21h-4V79C46 73 40 61 43 49c5 6 10 9 16 10-6-5-9-12-9-19 0-14-6-24 0-34z' transform='translate(-3 -2)'/><circle cx='28' cy='34' r='9'/><circle cx='74' cy='28' r='7'/><circle cx='20' cy='56' r='7'/><circle cx='80' cy='52' r='9'/></g></svg>") no-repeat center/contain}
.side{padding-bottom:48px}.side>*{position:relative;z-index:1}
.brand{padding:6px 10px 18px;margin-bottom:8px;border-bottom:1px solid rgba(231,211,160,.22)}
.brand img{max-width:176px}
.brand .nm{color:#fff;font-size:19px}
.by{color:var(--gold3)}.by b{color:var(--gold2)}
.nav{color:#e9dcc6;border-radius:6px;position:relative;transition:background .15s,color .15s}
.nav svg{opacity:.85}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:linear-gradient(90deg,rgba(201,162,74,.28),rgba(201,162,74,.08));color:#fff}
.nav.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--gold2)}
.nav.on svg{color:var(--gold2);opacity:1}
.side .foot{color:rgba(246,239,228,.6);font-size:11.5px;border-top:1px solid rgba(231,211,160,.18)}
.badge{background:var(--gold2);color:var(--oak-d)}
/* page header */
.top{position:relative;padding:20px 24px;margin:-4px 0 18px;border-radius:12px;background:linear-gradient(120deg,var(--oak-d) 0%,var(--oak) 55%,#7a5530 100%);box-shadow:var(--sh);overflow:hidden;color:#fff}
.top::before{content:"";position:absolute;right:-20px;top:-34px;width:210px;height:210px;opacity:.13;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23e7d3a0'><path d='M50 6c10 8 18 20 18 34 0 8-3 14-8 19 6-1 12-5 16-11 3 12-3 25-14 31v21h-4V79C46 73 40 61 43 49c5 6 10 9 16 10-6-5-9-12-9-19 0-14-6-24 0-34z' transform='translate(-3 -2)'/><circle cx='28' cy='34' r='9'/><circle cx='74' cy='28' r='7'/><circle cx='20' cy='56' r='7'/><circle cx='80' cy='52' r='9'/></g></svg>") no-repeat center/contain}
.top::after{content:"";position:absolute;left:24px;bottom:0;width:72px;height:3px;background:var(--gold2);border-radius:3px 3px 0 0}
.top>*{position:relative;z-index:1}
.top h1{color:#fff;font-size:30px;letter-spacing:-.005em}
.top .chip{background:rgba(255,255,255,.1);border-color:rgba(231,211,160,.35);color:#f3e8d3}
.top .chip:hover{background:rgba(255,255,255,.18)}
.top .chip.on{background:var(--gold2);border-color:var(--gold2);color:var(--oak-d)}
.top .btn{background:rgba(255,255,255,.1);border-color:rgba(231,211,160,.4);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.2)}
.top .btn.pri{background:var(--gold2);border-color:var(--gold2);color:var(--oak-d)}
.top .inp{background:rgba(255,255,255,.95);color:var(--text)}
/* cards */
.card{border-radius:10px;border-color:var(--line);position:relative}
.kpi{border-top:3px solid var(--gold2);overflow:hidden}
.kpi::after{content:"";position:absolute;right:-14px;bottom:-14px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.18),transparent 70%)}
.kpi .l{text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--gold)}
.kpi .v{font:700 34px "Playfair Display",Georgia,serif;color:var(--oak);margin-top:6px}
.kpi .v .sub{font:700 14px Lato,sans-serif}
.meter{height:7px;background:var(--soft)}
.meter div{background:linear-gradient(90deg,var(--oak),var(--gold2))}
.card h3{font:700 17px "Playfair Display",Georgia,serif;color:var(--oak);padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:12px;position:relative}
.card h3::after{content:"";position:absolute;left:0;bottom:-1px;width:36px;height:2px;background:var(--gold2)}
.fill{background:linear-gradient(90deg,var(--oak),var(--oak2))}.fill.g{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.track{background:var(--soft)}
/* buttons per site: 4px radius */
.btn{border-radius:4px;background:#fff;border-color:var(--sand);color:var(--oak)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--oak);border-color:var(--oak);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 2px 6px rgba(60,36,14,.25)}
.btn.pri:hover{background:var(--oak-d)}
a.btn{color:var(--oak)}
.chip{border-color:var(--sand);color:var(--oak)}.chip.on{background:var(--oak);border-color:var(--oak)}
.pill{background:var(--soft);color:var(--oak2)}
.pill.acc{background:var(--gold3);color:var(--oak-d)}
/* tables, lists, board */
th{background:var(--panel2);color:var(--oak);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border-bottom:2px solid var(--sand)}
tbody tr:hover td{background:#fbf6ec}
.av{background:linear-gradient(135deg,var(--oak),var(--oak2));color:var(--gold3)}
.colm{background:#f1e8da;border-top:3px solid var(--gold2)}
.deal{border-radius:8px}.deal:hover{border-color:var(--gold2);box-shadow:0 4px 14px rgba(60,36,14,.12)}
.grp{color:var(--gold)}
.sec h4{font-family:"Playfair Display",Georgia,serif;font-size:15px;color:var(--oak)}
/* drawer, modal */
.dh{background:linear-gradient(120deg,var(--oak-d),var(--oak));color:#fff;border-bottom:3px solid var(--gold2)}
.dh h2{color:#fff}.dh .sub{color:var(--gold3)}.dh .x{color:#fff}.dh .x:hover{background:rgba(255,255,255,.15)}
.mbox{border-radius:10px;border-top:4px solid var(--gold2)}.mbox h2{color:var(--oak)}
.overlay,.modal{background:rgba(40,24,8,.5)}
.inp{border-color:var(--sand);border-radius:4px}.inp:focus{outline:2px solid var(--gold3);border-color:var(--gold)}
/* call desk */
.q{border-left-color:var(--gold2);border-radius:6px;background:linear-gradient(90deg,#fffdf8,#fff)}
.q:hover{border-color:var(--gold2);box-shadow:0 2px 10px rgba(60,36,14,.1)}
.qi.on{background:linear-gradient(90deg,rgba(201,162,74,.22),var(--soft));box-shadow:inset 3px 0 0 var(--gold2)}
.stg{border-left:3px solid var(--gold2);background:#f8f1e4}
.adlib{background:var(--gold3);color:var(--oak-d)}
/* footer ribbon */
.ribbon{background:linear-gradient(90deg,var(--oak-d),var(--oak),var(--oak-d));border-top:2px solid var(--gold2);color:var(--cream)}
.ribbon b{color:var(--gold2)}
.banner{background:#fbf3df;border-color:var(--gold3);border-left:4px solid var(--gold2)}.banner b{color:var(--gold)}
.mobnav{background:var(--oak-d);border-top:2px solid var(--gold2)}
.mobnav .nav{color:#e9dcc6}.mobnav .nav.on{color:#fff;background:rgba(201,162,74,.22)}.mobnav .nav.on::before{display:none}
@media (max-width:820px){.mobnav{background:var(--oak-d)!important;border-top:2px solid var(--gold2)!important}.top{padding:14px 16px}.top h1{font-size:24px}.kpi .v{font-size:28px}}

/* ===== demo layer ===== */
.tickwrap{position:sticky;top:0;z-index:25;margin:-22px -28px 16px;background:var(--oak-d);border-bottom:2px solid var(--gold2);box-shadow:0 4px 14px rgba(40,24,8,.2)}
.trk{display:flex;align-items:center;height:34px;overflow:hidden;color:#f3e8d3;font-size:13px}
.trk+.trk{border-top:1px solid rgba(231,211,160,.18)}
.tlab{flex:0 0 auto;height:100%;display:flex;align-items:center;padding:0 14px;font-weight:900;font-size:11px;letter-spacing:.09em;text-transform:uppercase;background:var(--gold2);color:var(--oak-d);position:relative;z-index:2}
.t2 .tlab{background:var(--gold3)}
.mq{flex:1;overflow:hidden;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.mqi{display:inline-flex;white-space:nowrap;animation:mq linear infinite;will-change:transform}
.mq:hover .mqi{animation-play-state:paused}
.t2 .mqi{animation-direction:normal}

function load(){
 try{const raw=localStorage.getItem(KEY);if(raw){DB=JSON.parse(raw);if(!DB.drafts)DB.drafts=DB.sample?seedDrafts():[];if(!DB.calls)DB.calls=[];return}}catch(e){storageOK=false}
 DB=seed();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){storageOK=false}}
const byId=(a,id)=>a.find(x=>x.id===id);
const HH=id=>byId(DB.hh,id), DL=id=>byId(DB.deals,id), TK=id=>byId(DB.tasks,id), ST=id=>byId(DB.stages,id), PR=id=>byId(DB.prospects,id);
const stype=d=>(ST(d.stage)||{}).type||'open';

/* ---------- state ---------- */
const UI={view:'dashboard',owner:'All',seg:'All',sig:'All',taskTab:'open',drawer:null,q:'',cseg:'All',callId:null,outcome:null,notes:'',cdate:'',stage:'connection',scriptSeg:null,panel:'script',asked:{},auto:true};
function refresh(){save();renderNav();renderMain();if(UI.drawer)renderDrawer()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- nav ---------- */
const NAV=[['dashboard','Dashboard',ICON.dash],['radar','Lead Radar',ICON.radar],['social','Social',ICON.social],['finder','Prospect Finder',ICON.find],['calls','Call Desk',ICON.phone],['outreach','Outreach',ICON.send],['pipeline','Pipeline',ICON.pipe],['households','Households',ICON.home],['tasks','Tasks',ICON.check],['settings','Settings',ICON.gear]];
const dueCount=()=>DB.tasks.filter(t=>!t.done&&t.due&&t.due<=today()).length;
function renderNav(){
 const due=dueCount();
 const items=NAV.map(([k,l,i])=>`<button class="nav ${UI.view===k?'on':''}" data-nav="${k}">${i}<span>${l}</span>${k==='tasks'&&due?`<span class="badge">${due}</span>`:''}</button>`).join('');
 document.getElementById('side').innerHTML=`<div class="brand"><img src="https://www.silveroakfs.com/airo-assets/images/logo/horizontal/dark" alt="Silver Oak Financial" onerror="this.outerHTML='<span class=&quot;nm&quot;>Silver Oak Financial</span>'"><span class="by">by <b>TAZ</b> &middot; demo build</span></div>${items}<div class="foot">${storageOK?'Saved in this browser':'Browser storage is off, changes will not be kept'}</div>`;
 document.getElementById('mobnav').innerHTML=NAV.filter(n=>['dashboard','radar','social','calls','pipeline','tasks'].includes(n[0])).map(([k,l,i])=>`<button class="nav ${UI.view===k?'on':''}" data-nav="${k}">${i}<span>${l.replace('Prospect Finder','Finder').replace('Lead Radar','Radar').replace('Call Desk','Calls').replace('Households','Homes').replace('Dashboard','Dash')}</span></button>`).join('');
}
function go(v){UI.view=v;UI.q='';closeDrawer();renderNav();renderMain();if(typeof renderTick==='function')renderTick();window.scrollTo(0,0)}

function wordingCheck(txt){
 const bad=[[/guarante/i,'guarantee'],[/\breturns?\b/i,'returns'],[/outperform/i,'outperform'],[/risk[- ]free/i,'risk-free'],[/\bbeat the market\b/i,'beat the market']];
 const t2=txt.replace(/\btax returns?\b/ig,'tax filings');const hits=bad.filter(([re])=>re.test(t2)).map(b=>b[1]);
 if(!txt.trim())return '';
 return hits.length?`<div class="check bad"><b>Fix before sending.</b> Found: ${hits.map(h=>`"${esc(h)}"`).join(', ')}. Rephrase around planning and process instead.</div>`:'<div class="check ok"><b>Looks clean.</b> No flagged wording found. Your compliance contact still has the final say.</div>';
}

let FORM=null;
function openForm({title,fields,values={},onSave,saveLabel='Save'}){
 FORM={fields,onSave};
 const f=fields.map(x=>{
  const v=values[x.key]==null?'':values[x.key];
  let input;
  if(x.type==='select')input=`<select class="inp" name="${x.key}">${x.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  else if(x.type==='textarea')input=`<textarea class="inp" name="${x.key}">${esc(v)}</textarea>`;
  else input=`<input class="inp" name="${x.key}" type="${x.type||'text'}" value="${esc(v)}" placeholder="${esc(x.ph||'')}" ${x.list?`list="dl-${x.key}"`:''}>${x.list?`<datalist id="dl-${x.key}">${x.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return `<div class="fld ${x.full?'full':''}"><label>${esc(x.label)}${x.req?' *':''}</label>${input}</div>`;
 }).join('');
 document.getElementById('mbox').innerHTML=`<h2>${esc(title)}</h2><form class="mform" id="mform" autocomplete="off">${f}<button type="submit" hidden></button></form><div class="mfoot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="save-form">${esc(saveLabel)}</button></div>`;
 document.getElementById('modal').classList.add('show');
 document.getElementById('mform').onsubmit=e=>{e.preventDefault();submitForm()};
 setTimeout(()=>{const first=document.querySelector('#mform .inp');if(first)first.focus()},30);
}
function closeModal(){document.getElementById('modal').classList.remove('show');FORM=null}
function submitForm(){
 if(!FORM)return;
 const data={};new FormData(document.getElementById('mform')).forEach((v,k)=>data[k]=typeof v==='string'?v.trim():v);
 const miss=FORM.fields.find(x=>x.req&&!data[x.key]);
 if(miss){toast(miss.label+' is required');return}
 const ok=FORM.onSave(data);if(ok===false)return;
 closeModal();refresh();
}

function mq(items,cls,label){
 if(!items.length)return '';
 let g=items.join('');while((g.match(/class="ti/g)||[]).length<8)g+=items.join('');
 const secs=Math.max(40,(g.match(/class="ti/g)||[]).length*8);
 return `<div class="trk ${cls}"><span class="tlab">${label}</span><div class="mq"><div class="mqi" style="animation-duration:${secs}s"><span class="mqg">${g}</span><span class="mqg" aria-hidden="true">${g}</span></div></div></div>`;
}

function dailySignals(){
 const r=rng(11),base={fb:9,ig:7,tt:6,web:8,em:3,li:2},out=[];
 const now=new Date();const cnt={};feedEvents().forEach(e=>{const d=new Date(e.t);const k=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);if(k===0){cnt[e.ch]=(cnt[e.ch]||0)+1}});
 for(let i=DAYS-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const row={d,v:{}};
  Object.keys(base).forEach(c=>{row.v[c]=i===0?(cnt[c]||0):Math.round(base[c]*(.6+r()*.9)*(1+(DAYS-i)/40)*([0,6].includes(d.getDay())?.6:1))});out.push(row)}
 return out;
}
function stackChart(){
 const data=dailySignals(),cs=['fb','ig','tt','web','em','li'],W=600,H=210,pl=30,pb=26,pt=10,bw=(W-pl-6)/DAYS;
 const tot=data.map(x=>cs.reduce((a,c)=>a+x.v[c],0)),mx=Math.max(10,...tot),sy=v=>(H-pb-pt)*v/mx;
 let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Signals per day by channel, last 14 days">`;
 for(let g=0;g<=4;g++){const y=H-pb-(H-pb-pt)*g/4;svg+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e8ddcf"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#7a6a5a">${Math.round(mx*g/4)}</text>`}
 data.forEach((x,i)=>{let y=H-pb;const bx=pl+i*bw+3;
  cs.forEach(c=>{const h=sy(x.v[c]);y-=h;const dim=UI.rch!=='All'&&UI.rch!==c;svg+=`<rect x="${bx}" y="${y}" width="${bw-6}" height="${Math.max(0,h)}" fill="${CH[c].c}" opacity="${dim?.18:1}"><title>${CH[c].n}: ${x.v[c]} on ${x.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</title></rect>`});
  if(i%2===(DAYS-1)%2||i===DAYS-1)svg+=`<text x="${bx+(bw-6)/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7a6a5a">${x.d.getMonth()+1}/${x.d.getDate()}</text>`});
 return svg+'</svg>';
}
function lineChart(){
 const W=600,H=210,pl=36,pb=26,pt=12,N=30,cs=['fb','ig','tt'];const r=rng(5);
 const base={fb:[1900,.9],ig:[1400,1.3],tt:[900,2.1]};
 const ser={};cs.forEach(c=>{let v=base[c][0];ser[c]=[];for(let i=0;i<N;i++){v=Math.max(200,v*(1+(r()-.42)*.12*base[c][1]/1.3)+base[c][1]*30);if(c==='tt'&&(i===21||i===22))v*=1.45;ser[c].push(Math.round(v))}});
 const show=UI.pch==='All'?cs:[UI.pch].filter(c=>cs.includes(c));
 const mx=Math.max(...show.flatMap(c=>ser[c])),x=i=>pl+(W-pl-8)*i/(N-1),y=v=>H-pb-(H-pb-pt)*v/mx;
 let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Reach per day, last 30 days">`;
 for(let g=0;g<=4;g++){const yy=H-pb-(H-pb-pt)*g/4;svg+=`<line x1="${pl}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#e8ddcf"/><text x="${pl-5}" y="${yy+4}" text-anchor="end" font-size="10" fill="#7a6a5a">${Math.round(mx*g/4/100)/10}k</text>`}
 show.forEach(c=>{const pts=ser[c].map((v,i)=>x(i)+','+y(v)).join(' ');svg+=`<polygon points="${x(0)},${H-pb} ${pts} ${x(N-1)},${H-pb}" fill="${CH[c].c}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${CH[c].c}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${x(N-1)}" cy="${y(ser[c][N-1])}" r="4" fill="${CH[c].c}"/>`});
 [0,7,14,21,29].forEach(i=>{const d=new Date();d.setDate(d.getDate()-(N-1-i));svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7a6a5a">${d.getMonth()+1}/${d.getDate()}</text>`});
 return {svg:svg+'</svg>',ser};
}

function rerender(){renderNav();renderMain();renderTick()}
Object.assign(ACT,{
 'radar-open':id=>{if(id)UI.rid=id;UI.rseg='All';UI.rch='All';UI.rtemp='All';go('radar');window.scrollTo(0,0)},
 'radar-pick':id=>{UI.rid=id;renderMain()},
 'go-social':()=>go('social'),
 'rseg':id=>{UI.rseg=id;renderMain()},'rtemp':id=>{UI.rtemp=id;renderMain()},
 'rch':id=>{UI.rch=UI.rch===id?'All':id;renderMain()},
 'pch':id=>{UI.pch=id;renderMain()},
 'post-pick':id=>{UI.postId=UI.postId===id?null:id;renderMain()},
 'post-approve':id=>{const p=POSTS.find(x=>x.id===id),t=document.getElementById('ptext');const txt=t?t.value:pstate(p).text;if(wordingCheck(txt).indexOf('Fix before')>-1){toast('Fix the flagged wording first');return}DS.posts[id]={status:'approved',text:txt};dsave();renderMain();toast('Marked compliance approved')},
 'post-schedule':id=>{const p=POSTS.find(x=>x.id===id),s=pstate(p);DS.posts[id]={status:'scheduled',text:s.text};dsave();renderMain();toast('Scheduled (demo only, nothing posts)')},
 'post-back':id=>{const p=POSTS.find(x=>x.id===id),s=pstate(p);DS.posts[id]={status:'draft',text:s.text};dsave();renderMain()},
 'radar-add':id=>{const l=DLD(id);if(!l||DS.added[id])return;
  const h={id:uid(),name:l.name,type:l.seg,city:l.town,members:l.name.split(' ')[0],review:'',notes:'From Lead Radar (demo). '+l.role+'. Latest: '+evText(l.ev[0])};
  const d={id:uid(),title:'First financial plan',hh:h.id,owner:l.owner,source:'Social media',stage:'s1',firstMeeting:'',created:Date.now()};
  DB.hh.push(h);DB.deals.push(d);DS.added[id]=d.id;dsave();refresh();rerender();toast(l.name+' added to pipeline, owner '+l.owner)},
 'radar-task':id=>{const l=DLD(id);if(!l)return;DB.tasks.push({id:uid(),title:'Follow up with '+l.name+' (Lead Radar)',due:today(),owner:l.owner,deal:'',done:false});refresh();toast('Task added for today')},
 'radar-copy':()=>{const t=document.getElementById('rdraft');if(!t)return;try{navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){t.select();toast('Select and copy')}},
 'sim':()=>{
  const pool=[['fb','comment','"Is this worth doing at 55?"'],['ig','dm','"Do you meet virtually?"'],['web','book',''],['tt','share',''],['em','reply','"Tuesday works for me."'],['web','contact',''],['li','dm','']];
  const before=dleads();const l=LEADS[Math.floor(Math.random()*LEADS.length)],ev=pool[Math.floor(Math.random()*pool.length)];
  const wasHot=before.find(x=>x.id===l.id).temp;
  l.ev.push({t:Date.now(),ch:ev[0],k:ev[1],x:ev[2]});
  const after=dleads().find(x=>x.id===l.id);
  DS.sim.push({t:l.ev[l.ev.length-1].t,ch:ev[0],who:l.name,text:evText(l.ev[l.ev.length-1]),lid:l.id,k:ev[1],key:l.id+'~'+l.ev[l.ev.length-1].t});
  UI.rid=l.id;rerender();
  toast(wasHot!=='hot'&&after.temp==='hot'?l.name+' just turned HOT ('+after.score+')':l.name+': '+SIGW[ev[1]][1].toLowerCase()+' (score '+after.score+')');
 }
});

});

 const t=e.target;
 if(t.id==='deal-stage'){const d=DL(t.dataset.id);if(d)moveDeal(d,t.value)}

 else if(t.id==='importfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.deals)||!Array.isArray(d.stages))throw 0;if(!confirm('Replace everything with this backup?'))return;DB=d;refresh();toast('Backup restored')}catch(err){toast('That file is not a backup from this draft')}t.value=''};r.readAsText(t.files[0])}
});

    consume:function(action,qty){qty=qty||1;var cost={lead_lookup:18,enrich:10,report:30,research_brief:80}[action]||0;

      if(S.bal<cost*qty)return Promise.reject(new Error('insufficient funds: need '+usd(cost*qty)+', have '+usd(S.bal)));
      S.bal-=cost*qty;save();paint();return Promise.resolve({balance:S.bal})},
    balance:function(){return S.bal}, wording:function(t){return (String(t).match(BAD)||[])}
  };

  /* ---------- Ask TAZ ---------- */
  var PAGES={score:['scorecard','pilot','results'],meet:['meeting','prep','brief','follow-up notes'],arch:['compliance','archive'],dashboard:['dashboard','home','overview'],radar:['radar','lead radar','hot leads'],social:['social','posts'],finder:['finder','prospect','prospects'],co:['companies','company','accounts','employers'],ct:['contacts','contact','people','everyone'],upl:['upload leads','upload','csv','import leads','my leads'],pmap:['prospect map','map','pennsylvania'],calls:['call desk','calls','call'],outreach:['outreach','emails'],pipeline:['pipeline','deals'],households:['households','clients','household'],tasks:['tasks','to do','todo'],settings:['settings']};
  function demoAnswer(q){
    var l=q.toLowerCase();
    var nav=/\b(go to|open|show me|take me|navigate)\b/.test(l);
    for(var k in PAGES){ if(PAGES[k].some(function(w){return l.indexOf(w)>-1}) && (nav||l.length<22)){ if(typeof go==='function'){go(k)} return {text:'Opening '+k+'.',cost:0}; } }
    if(/\b(report|summary of|summarize)\b/.test(l)){ if(SHOWP&&S.bal<30)return {text:'A report costs $0.30 and your wallet has '+usd(S.bal)+'. You can add funds in Settings.',cost:0};
      S.bal-=30;save();paint(); return {text:'Report (demo): 3 households have a review due this month, 2 deals are waiting on paperwork, 4 tasks are due this week. In the live version this table is built from your own records.',cost:30}; }
    if(/\b(draft|write|follow[- ]?up|email)\b/.test(l)) return {text:'Hi, thanks for your time today. I put together the next steps we talked about and will send them over by Friday. Does Tuesday at 10 work for a short call?\n\n(Draft only. Nothing is sent from here.)',cost:0};
    if(/\b(task|due|today)\b/.test(l)){ var n=(hasDB())?DB.tasks.filter(function(t){return !t.done}).length:0; return {text:'You have '+n+' open tasks. Say "open tasks" and I will take you there.',cost:0}; }
    return {text:'I can take you to a page ("open the pipeline"), draft a follow-up, or build a report. Asking and navigating are free.',cost:0};
  }
  function ask(q){
    S.msgs.push({r:'u',t:q}); paint();
    var done=function(a){ if(a.text)S.msgs.push({r:'a',t:a.text,c:a.cost||0}); if(a.action&&a.action.name==='go'&&typeof go==='function')go(a.action.input.page); save();paint(); };
    if(!LIVE){ setTimeout(function(){done(demoAnswer(q))},350); return; }
    var mode=/\b(go to|open|take me)\b/i.test(q)?'navigate':/\b(draft|write)\b/i.test(q)?'draft':/\breport\b/i.test(q)?'report':'ask';
    call('/v1/ask',{mode:mode,messages:[{role:'user',content:q}],context:{page:view()}}).then(function(j){S.bal=j.balance*CV;done({text:j.text||'',action:j.action,cost:mode==='report'?30:0})})
      .catch(function(e){done({text:e.status===402?'Not enough in the wallet for that. Add funds in Settings.':e.status===423?'This workspace is read-only until the latest payment clears.':'Something went wrong. Try again in a moment.'})});
  }

  /* ---------- Request a change ---------- */
  function nextBizDay(){var d=new Date();do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6);return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
  function requestModal(){
    var m=$('#taz-modal'); m.innerHTML='<div class="tz-box"><h3>Send feedback or request a change</h3><p class="tz-sub">Tell us what you like, what you want different, or what is missing. We reply by '+nextBizDay()+'.</p>'+
      '<label>What is it?<input id="tz-rt" placeholder="Add Instagram to the source filter"></label><label>Details<textarea id="tz-rb" rows="4" placeholder="Where you are, what you expected, what you want instead"></textarea></label>'+
      '<div class="tz-row"><button class="tz-btn ghost" id="tz-rc">Cancel</button><button class="tz-btn" id="tz-rs">Send request</button></div><div id="tz-rm" class="tz-sub"></div></div>'; m.classList.add('on');
    $('#tz-rc').onclick=function(){m.classList.remove('on')};
    $('#tz-rs').onclick=function(){var t=$('#tz-rt').value.trim(); if(!t){$('#tz-rm').textContent='Add a short title first.';return}
      var body={page:view(),title:t,body:$('#tz-rb').value};
      var ok=function(eta){ $('#tz-rm').innerHTML='Sent. We will respond by <b>'+esc(eta)+'</b>.'; $('#tz-rs').disabled=true; setTimeout(function(){m.classList.remove('on')},2200) };
      if(LIVE) call('/v1/requests',body).then(function(j){ok(j.respond_by?new Date(j.respond_by).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}):nextBizDay())}).catch(function(){$('#tz-rm').textContent='Could not send. Try again.'});
      else if(HOOK){ fetch(HOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({workspace:D.workspace||'silver-oak',from:D.user||'portal visitor',at:new Date().toISOString(),url:location.href},body))}).then(function(){ok(nextBizDay())}).catch(function(){$('#tz-rm').textContent='Could not send. Try again, or just email us.'}); }
      else { try{var a=JSON.parse(localStorage.getItem('taz_requests')||'[]');a.push(Object.assign({at:new Date().toISOString()},body));localStorage.setItem('taz_requests',JSON.stringify(a))}catch(e){} ok(nextBizDay()); }
    };
  }

  /* ---------- UI ---------- */
  var css='#tz-fb{position:fixed;right:0;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:100% 100%;margin-top:-4px;z-index:58;background:var(--oak-d,#3b2412);color:#f6efe4;border:0;border-radius:12px 12px 0 0;padding:10px 20px;font:800 14px Lato,system-ui;letter-spacing:.2px;cursor:pointer;box-shadow:0 -4px 14px rgba(60,36,14,.25)}#tz-fb:hover{background:var(--gold2,#c9a24a);color:#2b2118}@media(max-width:800px){#tz-fb{top:auto;bottom:130px;right:12px;transform:none;margin:0;border-radius:99px;padding:9px 14px}}'+
   '#tz-tourbtn{position:fixed;left:18px;bottom:18px;z-index:60;background:#fff;color:var(--oak,#5c3d1e);border:1px solid var(--gold2,#c9a24a);border-radius:99px;padding:9px 15px;font:800 13px Lato,system-ui;cursor:pointer;box-shadow:0 4px 14px rgba(60,36,14,.2)}'+
   '#tz-tour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:95;width:min(760px,calc(100vw - 24px));background:var(--oak-d,#3b2412);color:#f6efe4;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.35)}#tz-tour.on{display:flex}.tz-tn{background:var(--gold2,#c9a24a);color:#2b2118;font:800 12px Lato,system-ui;border-radius:99px;padding:5px 10px;white-space:nowrap}.tz-tt{flex:1;display:flex;flex-direction:column;gap:2px;font:14px Lato,system-ui}.tz-tt b{font-size:15px}.tz-tt span{opacity:.85;font-size:13px;line-height:1.35}.tz-tb{display:flex;gap:6px}.tz-tb button{background:#ffffff1f;color:#fff;border:0;border-radius:10px;padding:9px 12px;font:700 13px Lato,system-ui;cursor:pointer}.tz-tb button#tz-tx{background:var(--gold2,#c9a24a);color:#2b2118}.tz-tb button:disabled{opacity:.35}'+
   '@media(max-width:800px){#tz-tourbtn{bottom:130px}#tz-tour{bottom:76px;flex-wrap:wrap}}'+
   '#taz-chip{position:fixed;bottom:22px;right:150px;z-index:60;background:var(--oak,#5c3d1e);color:#f6efe4;border:0;border-radius:99px;padding:7px 14px;font:700 13px Lato,system-ui;cursor:pointer;box-shadow:0 4px 14px rgba(60,36,14,.25)}'+
   '#taz-chip small{opacity:.7;font-weight:600;margin-left:4px}#taz-fab{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--gold2,#c9a24a);color:#2b2118;border:0;border-radius:99px;padding:12px 18px;font:800 14px Lato,system-ui;cursor:pointer;box-shadow:0 8px 22px rgba(60,36,14,.3)}'+
   '#taz-panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:70;background:var(--panel,#fff);border-left:1px solid var(--line,#e8ddcf);box-shadow:-10px 0 30px rgba(40,24,8,.18);transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}#taz-panel.on{transform:none}'+
   '.tz-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line,#e8ddcf);background:var(--oak-d,#3b2412);color:#f6efe4}.tz-h b{font-size:15px}.tz-h button{margin-left:auto;background:none;border:0;color:#f6efe4;font-size:20px;cursor:pointer}'+
   '.tz-body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.tz-m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap}.tz-m.u{align-self:flex-end;background:var(--soft,#efe4d6)}.tz-m.a{align-self:flex-start;background:#f7f2ea;border:1px solid var(--line,#e8ddcf)}'+
   '.tz-m small{display:block;margin-top:5px;color:var(--muted,#7a6a5a)}.tz-warn{margin-top:6px;padding:6px 8px;background:var(--warns,#fdf1dc);border-radius:8px;font-size:12px;color:#7a4a05}'+
   '.tz-foot{border-top:1px solid var(--line,#e8ddcf);padding:10px 12px}.tz-foot form{display:flex;gap:8px}.tz-foot input{flex:1;border:1px solid var(--line,#e8ddcf);border-radius:8px;padding:9px 10px}.tz-btn{background:var(--oak,#5c3d1e);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.tz-btn.ghost{background:transparent;color:var(--oak,#5c3d1e);border:1px solid var(--line,#e8ddcf)}.tz-btn:disabled{opacity:.5}'+
   '.tz-links{display:flex;gap:12px;margin-top:8px;font-size:12px}.tz-links a{color:var(--oak2,#7a5530);cursor:pointer;text-decoration:underline}'+
   '@media(max-width:800px){#taz-fab{bottom:78px;right:12px}#taz-chip{bottom:84px;right:auto;left:12px}.tz-pop{bottom:128px;right:12px;left:12px;width:auto}}#taz-modal{position:fixed;inset:0;z-index:90;background:rgba(30,18,8,.45);display:none;align-items:center;justify-content:center;padding:16px}#taz-modal.on{display:flex}.tz-box{background:#fff;border-radius:14px;padding:20px;width:min(440px,100%)}.tz-box h3{margin:0 0 4px}.tz-box label{display:block;margin-top:10px;font-weight:700;font-size:12.5px}.tz-box input,.tz-box textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line,#e8ddcf);border-radius:8px;padding:9px 10px;font-weight:400}.tz-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.tz-sub{color:var(--muted,#7a6a5a);font-size:12.5px;margin:4px 0}'+
   '.tz-list{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7}.tz-pop{position:fixed;bottom:66px;right:150px;max-height:70vh;overflow:auto;z-index:61;width:min(320px,calc(100vw - 32px));background:#fff;border:1px solid var(--line,#e8ddcf);border-radius:12px;padding:14px 16px;box-shadow:0 12px 30px rgba(40,24,8,.2);display:none}.tz-pop.on{display:block}.tz-pop h4{margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold,#8a6914)}';

  /* ---------- Guided demo: presenter drives with arrow keys or the buttons ---------- */
  var STEPS=[
   ['ct','Contacts','Your CRM. Everyone A to Z with their last meeting, next follow-up and status. Open anyone to log a call, see their history, keep case notes and assign them to someone on the team.'],
   ['co','Companies','Every employer on your list rolled up, ranked by warmth. TAZ suggests the next move for each account, like a lunch-and-learn or an owners meeting, and you approve it.'],
   ['dashboard','Your day at a glance','Hot leads, tasks due and the pipeline on one screen, built around the answers you gave us.'],
   ['radar','Lead Radar','Saved leads that just did something: opened an email, visited a page, changed jobs. Call the warm ones first.'],
   ['social','Social','Facebook, Instagram and TikTok activity and the posts planned for Silver Oak.'],
   ['finder','Prospect Finder','Describe who you want to reach. Each lookup shows its data cost and our margin before you spend.'],
   ['upl','Upload Leads','Already have a list? Drop in a CSV. The portal removes duplicates and people you already have, shows what the file tells us, then TAZ researches each person for signals like a new job or a business sale.'],
   ['pmap','Prospect Map','Where your list lives across Pennsylvania, shaded by county, with coffee shops near each prospect for a first conversation. Radar and Social now show the source of every activity and a saved capture.'],
   ['calls','Call Desk','Question bank by segment, voicemail and objection scripts, and one-tap call outcomes.'],
   ['outreach','Outreach and connections','Sequences that run on your behalf, and where each of you connects your own LinkedIn. Sales Navigator rides on Aidan\'s sign-in. Nothing goes out until you approve it.'],
   ['pipeline','Pipeline','Every conversation by stage, with the next step always visible.'],
   ['households','Households','Client households and review dates in one place.'],
   ['tasks','Tasks','Follow-ups created automatically from calls and replies.'],
   ['score','Pilot scorecard','Your decision page. The pilot goals, where you stand against them, and who is sending you business, ready for Dec 2.'],
   ['meet','Meetings','Before a meeting: a one-page brief. After: paste your notes and get the follow-up email, a CRM note and your to-dos. You approve, nothing sends itself.'],
   ['arch','Compliance archive','One searchable record of every message, with risky wording flagged and held back before it goes out.'],
   ['settings','Settings','What is live in this draft, what arrives in the pilot, and your data: export it or clear it anytime.'],
   ['wallet','Your wallet, in dollars','$160 a seat each month. Every charge is the real data cost plus our margin, shown openly. Calls are a flat add-on, never metered by the minute.'],
   ['ask','Ask TAZ','Ask for a page, a draft or a report. Asking is free.'],
   ['change','Request a change','Tell us what you want different. We reply within two business days.']
  ];
  if(!SHOWP)STEPS=STEPS.filter(function(x){return x[0]!=='wallet'});
  var T={on:false,i:0};
  function tourShow(){
    var st=STEPS[T.i]; $('#taz-pop').classList.remove('on');
    if(st[0]==='wallet'){$('#taz-pop').classList.add('on')} else if(st[0]==='ask'){S.open=true;paint()} else if(st[0]==='change'){S.open=false;paint();requestModal()} else {S.open=false;$('#taz-modal').classList.remove('on');paint();if(typeof go==='function')go(st[0])}
    var b=$('#tz-tour'); b.innerHTML='<div class="tz-tn">'+(T.i+1)+' of '+STEPS.length+'</div><div class="tz-tt"><b>'+esc(st[1])+'</b><span>'+esc(st[2])+'</span></div><div class="tz-tb"><button id="tz-tp" '+(T.i?'':'disabled')+'>&#9664;</button><button id="tz-tx">'+(T.i<STEPS.length-1?'Next &#9654;':'Done')+'</button><button id="tz-te" aria-label="End">&times;</button></div>';
    $('#tz-tp').onclick=function(){tourGo(-1)};$('#tz-tx').onclick=function(){tourGo(1)};$('#tz-te').onclick=tourEnd;
  }
  function tourGo(d){var n=T.i+d;if(n<0)return;if(n>=STEPS.length){tourEnd();return}T.i=n;tourShow()}
  function tourStart(){T.on=true;T.i=0;$('#tz-tour').classList.add('on');$('#tz-tourbtn').style.display='none';tourShow()}
  function tourEnd(){T.on=false;$('#tz-tour').classList.remove('on');$('#tz-tourbtn').style.display='';$('#taz-pop').classList.remove('on');S.open=false;$('#taz-modal').classList.remove('on');paint()}
  document.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
    if(!T.on){ if(e.key==='g'&&e.altKey){tourStart()} return }
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();tourGo(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();tourGo(-1)}
    else if(e.key==='Escape'){tourEnd()}
  });
  function mount(){
    var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    var d=document.createElement('div');d.innerHTML='<button id="taz-chip" aria-label="Credits"></button><div class="tz-pop" id="taz-pop"></div><button id="taz-fab">Ask TAZ</button><aside id="taz-panel" aria-label="Ask TAZ"></aside><div id="taz-modal"></div><button id="tz-fb">Send feedback</button><button id="tz-tourbtn">&#9654; Guided demo</button><div id="tz-tour"></div>';
    while(d.firstChild)document.body.appendChild(d.firstChild);
    $('#tz-tourbtn').onclick=tourStart;$('#tz-fb').onclick=requestModal;
    if(/[?&]tour=1/.test(location.search))setTimeout(tourStart,400);
    $('#taz-chip').onclick=function(){$('#taz-pop').classList.toggle('on')};
    $('#taz-fab').onclick=function(){S.open=!S.open;paint();if(S.open)setTimeout(function(){var i=$('#tz-q');i&&i.focus()},50)};
    document.addEventListener('click',function(e){ if(!e.target.closest('#taz-pop,#taz-chip'))$('#taz-pop').classList.remove('on') });
    paint(); refresh();
  }
  function paint(){
    var chip=$('#taz-chip'); if(!chip)return;
    chip.style.display=SHOWP?'':'none'; chip.innerHTML='Wallet '+usd(S.bal)+'<small>'+(LIVE?'':'demo')+'</small>';
    $('#taz-pop').innerHTML='<b>'+usd(S.bal)+' left</b> <span class="tz-sub">of '+usd(INC)+' included this month</span><div class="tz-sub">Your wallet is dollars and cents, so you always know what you spent. Every charge is the data cost plus our margin, shown below.</div><h4>Always free</h4><ul class="tz-list">'+CORE.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><h4>What things cost</h4><ul class="tz-list">'+METERED.map(function(x){return '<li>'+x[0]+': <b>'+usd(x[1]+x[2])+'</b><br><span class="tz-sub">data cost '+usd(x[1])+' + TAZ margin '+usd(x[2])+'</span></li>'}).join('')+'</ul><div class="tz-sub">Calls are a flat monthly add-on, not metered by the minute.</div>';
    var p=$('#taz-panel'); p.classList.toggle('on',S.open);
    var msgs=S.msgs.length?S.msgs:[{r:'a',t:'Hi, I am TAZ. Ask me to open a page, draft a follow-up, or build a report. I never send anything for you.',c:0}];
    p.innerHTML='<div class="tz-h"><b>Ask TAZ</b><button id="tz-x" aria-label="Close">&times;</button></div><div class="tz-body" id="tz-body">'+msgs.map(function(m){
      var w=m.r==='a'?(m.t.match(BAD)||[]):[]; return '<div class="tz-m '+m.r+'">'+esc(m.t)+(m.c&&SHOWP?'<small>Charged '+usd(m.c)+' (data cost $0.12 + TAZ margin $0.18)</small>':'')+(w.length?'<div class="tz-warn">Wording check: "'+esc(w[0])+'" can read as a promise. Rephrase before using this.</div>':'')+'</div>'}).join('')+'</div>'+
      '<div class="tz-foot"><form id="tz-f"><input id="tz-q" autocomplete="off" placeholder="Ask, or say &quot;open the pipeline&quot;"><button class="tz-btn">Send</button></form><div class="tz-links"><a id="tz-req">Request a change</a><span class="tz-sub">'+(SHOWP?'Asking is free. Reports are $0.30.':'Asking is free.')+'</span></div></div>';
    $('#tz-x').onclick=function(){S.open=false;paint()};
    $('#tz-f').onsubmit=function(e){e.preventDefault();var i=$('#tz-q'),v=i.value.trim();if(v){i.value='';ask(v)}};
    $('#tz-req').onclick=requestModal;
    var b=$('#tz-body'); if(b)b.scrollTop=b.scrollHeight;
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>
